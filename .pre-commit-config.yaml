exclude: ^pnpm-lock\.yaml$

repos:
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.71.0
    hooks:
      - id: oxfmt
        types_or: [javascript, jsx, ts, tsx, markdown, json, yaml, toml, css]

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.86.0
    hooks:
      - id: oxlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: builtin
    hooks:
      # Enforces .claude/rules/machine-agnostic.md: no home directory with a
      # real username, on macOS, Linux or Windows. Placeholders such as
      # /Users/<name>/ don't match.
      - id: deny-pattern
        name: no hardcoded user home paths
        args: [--ignore-case, '(/Users/|/home/|\b[a-z]:[\\/]+Users[\\/]+)[\w.-]']
